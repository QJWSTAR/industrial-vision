[pytest]
# ============================================================
# pytest 配置 — 默认排除慢测试，加速常规开发循环
# ============================================================
# 默认排除：stress / performance / slow
# 这些测试通过显式 marker 运行：
#   pytest -m stress          # 仅压力测试
#   pytest -m performance     # 仅性能测试
#   pytest -m slow            # 所有慢测试
#   pytest --no-header -p no:cacheprovider  # 禁用缓存
#
# 全量测试（含慢测试）：
#   pytest -m ""              # 空标记 = 运行所有
#   pytest --override-ini="addopts="   # 覆盖默认排除
# ============================================================
addopts =
    -ra
    --strict-markers
    --tb=short
    -p no:cacheprovider
markers =
    smoke: 冒烟测试 — 核心 import 与启动验证（<2s）
    regression: 回归测试 — 关键 bug 修复回归
    unit: 单元测试 — 函数/类级别
    integration: 集成测试 — 模块间协作
    gui: GUI 测试 — QtBot/QTest
    export: 导出测试 — G-code/Robot/Report
    performance: 性能测试 — pytest-benchmark
    stress: 压力测试 — 大数据量/极端参数
    mock: Mock 测试 — MATLAB Mock / License Mock
    slow: 慢测试 — 运行时间 >2s
    real_qtimer: 使用真实 QTimer.singleShot 事件循环

# 默认排除慢测试（stress/performance/slow）
# 注意：使用 -m "not slow" 与 markers 配合，但 addopts 中 -m 会覆盖命令行
# 改用 deselect 策略：不显式运行 stress/performance 时跳过
testpaths = repair_app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 日志配置 — 减少测试输出噪声
log_cli = false
log_level = WARNING
