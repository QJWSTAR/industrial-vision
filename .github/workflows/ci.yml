name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: ${{ matrix.os == 'ubuntu-latest' && 'offscreen' || '' }}
        run: |
          pytest repair_app/tests/ -v --tb=short --cov=repair_app --cov-report=term-missing --cov-fail-under=60

      - name: Run benchmark
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python repair_app/tools/benchmark.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          pip install pre-commit

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure

  smoke-test:
    # M29: 主分支推送时执行冒烟测试，验证应用可正常启动
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Smoke test — verify import & version
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from repair_app import __version__; print(f'Version: {__version__}')"
          python -c "from repair_app.utils.config import APP_TITLE; print(f'Title: {APP_TITLE}')"
          python -c "from repair_app.core.path_planner import plan_path_from_cloud; print('path_planner OK')"
          python -c "from repair_app.communication.zmq_client import ZmqRepairClient; print('zmq_client OK')"
