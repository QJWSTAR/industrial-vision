// ============================================================
// [DEPRECATED] CSAM Algorithm Platform Protocol v3.0
// ============================================================
// 状态：已弃用（DEPRECATED）
//
// 弃用原因：
//   Protocol v3.0（通用 AlgorithmRequest/Response，JSON over TCP，端口 5570）
//   已被最终生产通信架构取代。唯一生产通信路径为：
//     GUI -> CoordinationService -> MatlabService / LegacyZmqClient
//         -> Bridge -> ZeroMQ (端口 5555) -> Protocol Buffers (v2.1)
//         -> matlab_bridge_server.m -> MATLAB R2025b
//
//   生产协议为 v2.1（repair_protocol.proto，业务专用 RepairRequest/RepairResult，
//   Protobuf 二进制，ZeroMQ 传输）。本 v3.0 协议仅保留用于向后兼容与
//   mock-server 测试套件（test_matlab_platform.py），不得用于生产代码。
//   详见 docs/COMMUNICATION.md。
//
// ------------------------------------------------------------
// 历史说明（仅供参考）：
//   用途：算法无关的通用通信协议
//
//   设计目标：
//     - 协议层不绑定任何具体业务（路径规划/形貌预测等）
//     - 算法输入输出由 AlgorithmMetadata 自描述
//     - 支持流式进度、取消、心跳、健康检查、版本协商
//     - 替代 v2.1 的 RepairRequest（业务专用、强耦合）
//
//   兼容性：
//     - v3.0 与 v2.1 并存（过渡期）
//     - Envelope + payload 设计，向后兼容
//
// 编译：
//   Python: python -m grpc_tools.protoc -I. --python_out=. algorithm_protocol_v3.proto
//   MATLAB: 使用 protobuf 编译器生成 Java 绑定或使用 Python 桥接
// ============================================================

syntax = "proto3";

package csam.algorithm.v3;

// ============================================================
// 信封：所有请求/响应的传输外壳
// ============================================================
message Envelope {
  string  request_id    = 1;   // 全局唯一，UUID
  int64   timestamp_ms  = 2;   // UTC 毫秒
  string  message_type  = 3;   // "ALGORITHM_REQUEST" | "HEARTBEAT" | ...
  string  protocol_ver  = 4;   // "3.0"
  bytes   payload       = 5;   // 具体消息的序列化字节
}

// ============================================================
// 算法调用
// ============================================================
message AlgorithmRequest {
  string algorithm_name  = 1;  // "path_planning.generate_path"
  string algorithm_ver   = 2;  // "1.0.0" 或 "latest"
  int32  timeout_ms      = 3;  // 0=用算法默认
  bool   stream_progress = 4;  // 是否启用流式进度
  map<string, Value>  params  = 10;  // 标量/小数组参数
  map<string, Tensor> inputs  = 11;  // 大块数组（点云/网格）
  map<string, bytes>  assets  = 12;  // 二进制资产（STL/PNG）
  string client_version = 20;
}

message AlgorithmResponse {
  enum Status {
    OK              = 0;
    ERR_INVALID     = 1;   // 输入参数无效
    ERR_TIMEOUT     = 2;   // 执行超时
    ERR_ALGORITHM   = 3;   // 算法内部异常
    ERR_DEPS        = 4;   // 依赖（工具箱）缺失
    ERR_NOT_FOUND   = 5;   // 算法未注册
    ERR_CANCELLED   = 6;   // 被取消
    ERR_VERSION     = 7;   // 版本不兼容
    UNKNOWN         = 99;
  }
  Status status           = 1;
  string error_code       = 2;   // 细分错误码字符串
  string error_message    = 3;   // 人类可读错误信息
  string error_stack      = 4;   // 堆栈跟踪（调试用）
  int64  compute_time_ms  = 5;   // 算法计算耗时
  map<string, Value>  results   = 10;  // 标量/小数组结果
  map<string, Tensor> artifacts = 11;  // 大块数组（航点/网格）
  map<string, bytes>  assets    = 12;  // 二进制资产（PNG/STL）
  string algorithm_ver   = 20;   // 实际执行的算法版本
  string request_id      = 21;   // 回显请求 ID
}

// ============================================================
// 算法元数据（自描述）
// ============================================================
message AlgorithmMetadata {
  string name             = 1;   // "path_planning.generate_path"
  string version          = 2;   // "1.0.0"
  string description      = 3;   // 人类可读描述
  string category         = 4;   // "path_planning" | "morphology" | ...
  FieldSchema input_schema  = 5;
  FieldSchema output_schema = 6;
  repeated string dependencies = 7;  // ["Map_Toolbox"]
  int32  timeout_default_ms = 8;
  bool   streaming          = 9;   // 是否支持流式进度
  bool   idempotent         = 10;  // 是否可安全重试
  repeated string tags      = 11;  // ["cpu_heavy","path_planning"]
}

message FieldSchema {
  map<string, FieldSpec> fields = 1;
}

message FieldSpec {
  string type         = 1;   // "Value" | "Tensor" | "bytes"
  repeated int32 shape = 2;  // 形状，-1 表示变长
  string units        = 3;   // "mm","m/s"...
  string range        = 4;   // "[0,1]"
  bool   required     = 5;
  string description  = 6;   // 字段说明
}

// ============================================================
// 进度更新（流式）
// ============================================================
message ProgressUpdate {
  string request_id     = 1;
  int32  stage_index    = 2;   // 阶段序号
  string stage_name     = 3;   // "slicing" | "searching" | ...
  float  progress       = 4;   // [0,1]
  string message        = 5;   // 面向 UI 的状态说明
  map<string, Tensor> partial_artifacts = 6;  // 增量结果
}

// ============================================================
// 心跳与健康检查
// ============================================================
message Heartbeat {
  string request_id  = 1;
  int64  client_ts_ms = 2;
}

message Pong {
  string request_id   = 1;
  int64  server_ts_ms = 2;
  int32  pending      = 3;   // 当前排队请求数
}

message HealthCheckRequest {
  string client_version = 1;
}

message HealthStatus {
  enum State {
    OK        = 0;
    DEGRADED  = 1;   // 部分算法不可用
    DOWN      = 2;
  }
  State state            = 1;
  string server_version  = 2;
  string matlab_version  = 3;
  float  memory_mb       = 4;
  int64  uptime_s        = 5;
  int32  pending_reqs    = 6;
  map<string, bool> toolbox_available = 7;  // {"Map_Toolbox": true, ...}
  float  error_rate_1m   = 8;   // 最近 1 分钟错误率
  int32  total_requests  = 9;   // 累计请求数
  int64  last_error_ts   = 10;  // 最近错误时间戳
}

// ============================================================
// 取消
// ============================================================
message Cancellation {
  string request_id = 1;
  string reason     = 2;
}

// ============================================================
// 版本协商
// ============================================================
message VersionNegotiate {
  string client_protocol = 1;
  string client_app      = 2;
  repeated string want_algorithms = 3;  // 客户端期望的算法
}

message VersionResult {
  string server_protocol      = 1;
  string server_app           = 2;
  bool   protocol_compatible  = 3;
  repeated string available_algorithms = 4;
  int32  algorithm_count      = 5;
}

// ============================================================
// 算法列表查询
// ============================================================
message ListAlgorithmsRequest {
  string category = 1;  // 按类别过滤，空=全部
}

message ListAlgorithmsResponse {
  repeated AlgorithmMetadata algorithms = 1;
}

// ============================================================
// 关闭
// ============================================================
message ShutdownRequest {
  string reason = 1;
  int32  grace_period_ms = 2;  // 宽限期
}

message ShutdownAck {
  bool   accepted       = 1;
  int32  pending_count  = 2;   // 仍在处理的请求数
  int64  estimated_drain_ms = 3;
}

// ============================================================
// 通用值类型
// ============================================================
message Value {
  oneof kind {
    double  num     = 1;
    int64   intval  = 2;
    string  str     = 3;
    bool    flag    = 4;
    Tensor  tensor  = 5;
  }
}

message Tensor {
  enum DType {
    F32 = 0;
    F64 = 1;
    I32 = 2;
    I64 = 3;
    U8  = 4;
  }
  DType dtype         = 1;
  repeated int32 shape = 2;   // 行主序
  bytes  data         = 3;    // 原始字节
  string units        = 4;    // "mm","m/s"...
}
